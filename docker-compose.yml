# One command for the whole stack:  docker compose up --build
#   frontend  http://localhost:3000
#   backend   http://localhost:8000/api/docs
name: beaufort

services:
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
      # auto: load the bundled January 2026 snapshot; fetch from Elexon only if it's missing.
      DATA_MODE: auto
      CORS_ORIGINS: http://localhost:3000
      WEB_CONCURRENCY: "2"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # Server-side only: the browser talks to the frontend, which proxies /api/* here.
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
