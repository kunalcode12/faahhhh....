[project]
name = "beaufort-api"
version = "1.0.0"
description = "Day-ahead wind desk API: as-of wind forecasts, accuracy analytics and calibrated uncertainty for GB power buyers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
# Native OpenTelemetry export (FastAPI >= 0.160 instruments itself; this adds the OTLP exporter).
otel = ["fastapi[opentelemetry]"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.15",
]

# Vercel's Python runtime looks for this to find the ASGI app.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["env", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplifications
    "C4",            # comprehensions
    "RUF",           # ruff-specific
    "ASYNC",         # async pitfalls
    "DTZ",           # no naive datetimes - this whole domain is about time zones
    "PT",            # pytest style
    "N",             # naming
    "S",             # bandit security checks
]
ignore = [
    "S311",  # `random` is used for retry jitter, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["env/", ".venv/"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "snapshot: tests that read the real bundled January 2026 snapshot",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
